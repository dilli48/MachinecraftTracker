# Nginx Reverse Proxy Configuration for Machinecraft Tracker
# Save this file to /etc/nginx/sites-available/machinecraft
# Symlink to /etc/nginx/sites-enabled/ machinecraft: sudo ln -s /etc/nginx/sites-available/machinecraft /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with YOUR_VPS_IP or your domain name

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Forward traffic to FastAPI Uvicorn backend running locally on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
