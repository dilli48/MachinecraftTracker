services:
  db:
    image: postgres:15-alpine
    container_name: machinecraft_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-SRIRAMSIR}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2008@batch}
      POSTGRES_DB: ${DB_NAME:-Machinecraft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-SRIRAMSIR} -d ${DB_NAME:-Machinecraft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: machinecraft_web
    restart: always
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      - DB_USER=${DB_USER:-SRIRAMSIR}
      - DB_PASSWORD=${DB_PASSWORD:-2008@batch}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-Machinecraft}
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: machinecraft_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
