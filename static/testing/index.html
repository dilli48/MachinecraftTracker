<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0284c7">
    <title>Machinecraft Jacquard QA & Testing App</title>
    <link rel="manifest" href="/static/testing/manifest.json">
    <link rel="stylesheet" href="/static/testing/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Mobile Header -->
    <header>
        <div class="brand-mobile">
            <div class="brand-logo">
                <i class="fa-solid fa-vial-circle-check"></i>
            </div>
            <div>
                <div class="brand-title">Machinecraft Jacquard</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">Quality Assurance & Testing</div>
            </div>
        </div>

        <button class="btn-refresh" onclick="app.refreshData()" title="Refresh Data">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-bar">
        <div class="tab-item active" id="tab-btn-log" onclick="app.switchTab('log')">
            <i class="fa-solid fa-pen-to-square"></i> Log Test
        </div>
        <div class="tab-item" id="tab-btn-undertest" onclick="app.switchTab('undertest')">
            <i class="fa-solid fa-clock-rotate-left"></i> In-Testing <span id="undertest-count-pill" class="pill-badge">0</span>
        </div>
        <div class="tab-item" id="tab-btn-history" onclick="app.switchTab('history')">
            <i class="fa-solid fa-list-check"></i> History
        </div>
    </nav>

    <!-- Main Container -->
    <main>
        <!-- Tab 1: Start / Log Test Report -->
        <section id="tab-log" class="tab-content active">
            <form id="testing-form" onsubmit="app.submitTestingReport(event)">
                <div class="card">
                    <div class="card-title">
                        <span>New QA Test Entry</span>
                        <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i>
                    </div>

                    <div class="form-group">
                        <label for="test_operator_id">Operator Staff *</label>
                        <select id="test_operator_id" class="input-mobile" required>
                            <option value="" disabled selected>-- Select Your Name --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test_line">Production Line Category *</label>
                        <select id="test_line" class="input-mobile" required onchange="app.onTestingLineChange()">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test_board_id">Product Board Model *</label>
                        <select id="test_board_id" class="input-mobile" required>
                            <!-- Filtered dynamically by selected production line -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test_serial_number">Board Serial Number *</label>
                        <input type="text" id="test_serial_number" class="input-mobile" required placeholder="e.g. SN-JAC-2026-001">
                    </div>

                    <div class="form-group">
                        <label for="test_type">Test Type *</label>
                        <select id="test_type" class="input-mobile" required onchange="app.onTestTypeChange()">
                            <option value="8_HOURS_ON_OFF" selected>8 Hours On/Off Test</option>
                            <option value="SECO_BOARD_QA">Seco Board QA Test</option>
                            <option value="DISPLAY_UNIT_QA">Display Unit QA Test</option>
                            <option value="CUSTOM_QA">Custom QA Test</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test_overall_status">Test Status / Outcome *</label>
                        <select id="test_overall_status" class="input-mobile" required>
                            <option value="IN_TESTING" selected>IN-TESTING 🟡 (Add to Active Testing Queue)</option>
                            <option value="PASS">PASS 🟢 (Complete Test Immediately)</option>
                            <option value="FAIL">FAIL 🔴 (Complete Test Immediately)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test_remarks">Remarks / Observations</label>
                        <input type="text" id="test_remarks" class="input-mobile" placeholder="Optional technician notes...">
                    </div>

                </div>

                <button type="submit" class="btn-submit-giant">
                    <i class="fa-solid fa-cloud-arrow-up"></i> SUBMIT / START TEST LOG
                </button>
            </form>
        </section>

        <!-- Tab 2: Boards Under Test (Active Queue) -->
        <section id="tab-undertest" class="tab-content">
            <div class="card">
                <div class="card-title">
                    <span>Boards Currently Under Test</span>
                    <span id="undertest-badge" class="badge-count" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24;">0 Active</span>
                </div>
                <div id="undertest-list-container">
                    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">Loading active boards under test...</div>
                </div>
            </div>
        </section>

        <!-- Tab 3: Completed Test Reports -->
        <section id="tab-history" class="tab-content">
            <div class="card">
                <div class="card-title">
                    <span>Completed Test Reports</span>
                    <span id="logs-count-badge" class="badge-count">0 logs</span>
                </div>
                <div id="reports-list-container">
                    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">Loading test history...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal 1: Update Outcome for Board Under Test -->
    <div class="modal-overlay" id="update-outcome-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div style="font-family: var(--font-head); font-weight: 700; font-size: 1.1rem;">Update Final Test Outcome</div>
                <button class="close-btn" onclick="app.closeModal('update-outcome-modal')">&times;</button>
            </div>
            <form id="update-outcome-form" onsubmit="app.submitFinalOutcome(event)" style="padding: 1.25rem; overflow-y: auto;">
                <div class="form-group">
                    <label>Board Serial Number</label>
                    <input type="text" id="modal_serial_display" class="input-mobile" readonly style="background: rgba(255,255,255,0.05); color: #38bdf8; font-weight: 700; font-family: monospace;">
                </div>

                <div class="form-group">
                    <label for="modal_operator_id">Operator Staff *</label>
                    <select id="modal_operator_id" class="input-mobile" required>
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="modal_test_type">Test Type *</label>
                    <select id="modal_test_type" class="input-mobile" required onchange="app.onModalTestTypeChange()">
                        <option value="8_HOURS_ON_OFF" selected>8 Hours On/Off Test</option>
                        <option value="SECO_BOARD_QA">Seco Board QA Test</option>
                        <option value="DISPLAY_UNIT_QA">Display Unit QA Test</option>
                        <option value="CUSTOM_QA">Custom QA Test</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modal_final_status">Final Outcome *</label>
                    <select id="modal_final_status" class="input-mobile" required>
                        <option value="PASS" selected>PASSED 🟢</option>
                        <option value="FAIL">REJECTED 🔴</option>
                    </select>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="modal_test_data_json" style="margin-bottom: 0;">Final Test Data Metrics (JSON) *</label>
                        <button type="button" class="btn-small-action" onclick="app.loadModalTestTemplate()">Reset Template</button>
                    </div>
                    <textarea id="modal_test_data_json" class="input-mobile" style="height: 120px; padding: 0.75rem; font-family: monospace; font-size: 0.85rem;" required></textarea>
                </div>

                <div class="form-group">
                    <label for="modal_remarks">Closing Remarks / Observations</label>
                    <input type="text" id="modal_remarks" class="input-mobile" placeholder="e.g. Burn-in completed with zero errors">
                </div>

                <button type="submit" class="btn-submit-giant" style="background: linear-gradient(135deg, #059669, #10b981);">
                    <i class="fa-solid fa-circle-check"></i> SAVE FINAL OUTCOME & CLOSE TEST
                </button>
            </form>
        </div>
    </div>

    <!-- Modal 2: JSON Metrics View Overlay -->
    <div class="modal-overlay" id="json-view-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div style="font-family: var(--font-head); font-weight: 700; font-size: 1.1rem;" id="modal-json-title">Test Telemetry JSON</div>
                <button class="close-btn" onclick="app.closeModal('json-view-modal')">&times;</button>
            </div>
            <pre id="modal-json-content" class="json-code-block"></pre>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script src="/static/testing/app.js"></script>
</body>
</html>
