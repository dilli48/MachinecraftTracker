<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP FLOOR PRODUCTION DISPLAY | Machine Craft Industries</title>
    <meta name="description" content="Live 24-inch Shop Floor Production Stage Inventory Display Matrix">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050811;
            --bg-card: rgba(13, 19, 36, 0.85);
            --bg-card-hover: rgba(23, 32, 58, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.4);
            --accent: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            /* Stage Color System */
            --color-empty: #94a3b8;
            --color-smd: #38bdf8;
            --color-pinsolder: #fbbf24;
            --color-dipsolder: #f97316;
            --color-cleaning: #c084fc;
            --color-testing: #f43f5e;
            --color-stock: #10b981;
            --color-delivery: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: 1rem;
        }

        /* Top Header Area */
        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .line-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--primary);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: #34d399;
        }

        .clock-box {
            text-align: right;
        }

        .clock-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.7rem;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1.1;
        }

        .clock-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .live-pulse {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            font-weight: 700;
            color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Stat Summary Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }

        .stat-card.wip::before { background: var(--primary); }
        .stat-card.assembly::before { background: var(--warning); }
        .stat-card.testing::before { background: var(--color-testing); }
        .stat-card.stock::before { background: var(--success); }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-number {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-top: 0.2rem;
        }

        .stat-card.wip .stat-number { color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .stat-card.assembly .stat-number { color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        .stat-card.testing .stat-number { color: #f43f5e; text-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
        .stat-card.stock .stat-number { color: #34d399; text-shadow: 0 0 20px rgba(52, 211, 153, 0.4); }

        .stat-icon {
            font-size: 2.2rem;
            opacity: 0.25;
        }

        /* Matrix Table Container */
        .matrix-container {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .matrix-header-bar {
            padding: 0.85rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .matrix-header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .matrix-table-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
        }

        .display-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .display-table th {
            background: rgba(15, 23, 42, 0.95);
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1rem 0.75rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .display-table th.board-col {
            text-align: left;
            padding-left: 1.5rem;
            width: 22%;
        }

        .display-table th.cat-col {
            text-align: left;
            width: 12%;
        }

        .display-table td {
            padding: 0.95rem 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .display-table td.board-cell {
            text-align: left;
            padding-left: 1.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
        }

        .display-table td.cat-cell {
            text-align: left;
        }

        .display-table tbody tr {
            transition: background 0.2s ease;
        }

        .display-table tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.015);
        }

        .display-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Plain Crisp Stage Quantity Numbers (Stat-Card-Style Text) */
        .qty-badge {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            text-align: center;
            letter-spacing: -0.5px;
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: none;
        }

        .qty-empty {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.9rem;
            color: rgba(255, 255, 255, 0.12);
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: none;
        }

        .qty-emptyboard { color: #2dd4bf; }
        .qty-smd { color: #38bdf8; }
        .qty-pinsolder { color: #fbbf24; }
        .qty-dipsolder { color: #f97316; }
        .qty-cleaning { color: #c084fc; }
        .qty-testing { color: #f43f5e; }
        .qty-stock { color: #34d399; }
        .qty-delivery { color: #818cf8; }

        /* Totals Footer Row */
        .display-table tfoot tr {
            background: rgba(15, 23, 42, 0.98);
            border-top: 3px solid var(--primary);
        }

        .display-table tfoot td {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            padding: 1.1rem 0.75rem;
        }

        .display-table tfoot td.total-label {
            text-align: left;
            padding-left: 1.5rem;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* Footer Info Bar */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Category Pill */
        .cat-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive Adjustments for 24" Displays */
        @media (min-width: 1600px) {
            body { padding: 1.25rem; }
            .header-title { font-size: 2.2rem; }
            .display-table td.board-cell { font-size: 1.6rem; }
            .qty-badge { font-size: 2.5rem; }
            .qty-empty { font-size: 2.2rem; }
            .display-table th { font-size: 1.15rem; padding: 1.1rem 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation & Clock Bar -->
    <header class="display-header">
        <div class="header-title-box">
            <div class="brand-logo-badge">MC</div>
            <div>
                <h1 class="header-title">ProductionData</h1>
                <div class="header-subtitle">Live Stage Tracking</div>
            </div>
        </div>

        <div class="header-controls">
            <div class="control-group">
                <span class="control-label">Line:</span>
                <select id="line-filter-select" class="line-select" onchange="displayApp.onLineChange()">
                </select>
            </div>

            <div class="control-group">
                <span class="control-label">Rows:</span>
                <select id="page-size-select" class="line-select" onchange="displayApp.onPageSizeChange()">
                    <option value="7">7 Rows (Big Text)</option>
                    <option value="10" selected>10 Rows</option>
                    <option value="15">15 Rows (All Boards)</option>
                    <option value="999">Show All</option>
                </select>
            </div>

            <button id="auto-cycle-btn" class="toggle-btn active" onclick="displayApp.toggleAutoCycle()">
                <i class="fa-solid fa-rotate fa-spin"></i> Auto-Cycle: ON (15s)
            </button>

            <button class="toggle-btn" onclick="displayApp.toggleFullscreen()">
                <i class="fa-solid fa-expand"></i> Fullscreen
            </button>

            <div class="clock-box">
                <div class="clock-time" id="clock-time">00:00:00 AM</div>
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 0.6rem;">
                    <span class="live-pulse"><span class="pulse-dot"></span> LIVE</span>
                    <span class="clock-date" id="clock-date">Mon, 18 Aug 2026</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Full Screen Matrix Table -->
    <main class="matrix-container">
        <div class="matrix-header-bar">
            <div class="matrix-header-title">
                <i class="fa-solid fa-table-cells" style="color: var(--primary);"></i>
                <span id="current-line-title">SELECT PRODUCTION LINE</span>
                <span id="page-indicator-badge" class="cat-badge" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); display: none; font-size: 0.95rem; font-weight: 700; margin-left: 0.5rem;">Page 1/1</span>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div id="page-nav-btns" style="display: none; gap: 0.4rem;">
                    <button class="toggle-btn" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="displayApp.prevPage()"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                    <button class="toggle-btn" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="displayApp.nextPage()">Next <i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;" id="last-updated-text">
                    Last updated: Just now
                </div>
            </div>
        </div>

        <div class="matrix-table-wrapper">
            <table class="display-table">
                <thead>
                    <tr id="matrix-thead-row">
                        <th class="board-col">Product Board</th>
                        <th>Loading...</th>
                    </tr>
                </thead>
                <tbody id="matrix-tbody">
                    <tr>
                        <td colspan="10" style="padding: 3rem; text-align: center; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Loading Live Production Matrix...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="footer-bar">
        <div><i class="fa-solid fa-circle-info"></i> Machine Craft Shop Floor Display System v2.0 • Auto-refreshes every 8 seconds</div>
        <div id="cycle-status-text">Mode: Static View</div>
    </footer>

    <!-- Logic Script -->
    <script>
        const displayApp = {
            stages: [],
            matrixData: [],
            allLineCategories: [],
            selectedLine: '',
            pageSize: 10,
            currentPage: 0,
            autoCycle: true,
            cycleIndex: 0,
            cycleInterval: null,
            refreshInterval: null,

            async init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);

                await this.fetchAllCategories();
                await this.fetchData();
                this.refreshInterval = setInterval(() => this.fetchData(), 8000);

                // Default Auto-Cycle to ON when page opens
                this.startAutoCycle();
            },

            updateClock() {
                const now = new Date();
                document.getElementById('clock-time').innerText = now.toLocaleTimeString('en-US', { hour12: true });
                document.getElementById('clock-date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
            },

            async fetchAllCategories() {
                try {
                    const res = await fetch('/api/boards');
                    if (res.ok) {
                        const boards = await res.json();
                        const categories = Array.from(new Set(
                            boards
                                .map(b => b.production_line_category)
                                .filter(c => c && c.trim() !== '')
                        )).sort();
                        if (categories.length > 0) {
                            this.allLineCategories = categories;
                            this.populateLineDropdown();
                        }
                    }
                } catch(e) {
                    console.error('Error fetching board categories:', e);
                }
            },

            async fetchData() {
                try {
                    const url = this.selectedLine 
                        ? `/api/production/stage-matrix?production_line=${encodeURIComponent(this.selectedLine)}`
                        : `/api/production/stage-matrix`;

                    const res = await fetch(url);
                    if (!res.ok) return;

                    const data = await res.json();
                    this.stages = data.stages || [];
                    this.matrixData = data.matrix || [];

                    // Fallback extract categories if allLineCategories is not populated yet
                    if (!this.allLineCategories || this.allLineCategories.length === 0) {
                        const categories = Array.from(new Set(
                            this.matrixData
                                .map(b => b.production_line_category)
                                .filter(c => c && c.trim() !== '')
                        )).sort();
                        if (categories.length > 0) {
                            this.allLineCategories = categories;
                        }
                    }

                    this.populateLineDropdown();
                    this.renderTableHeader();
                    this.renderTableBody();

                    document.getElementById('last-updated-text').innerText = 'Last updated: ' + new Date().toLocaleTimeString('en-US', { hour12: true });
                } catch (e) {
                    console.error('Fetch error:', e);
                }
            },

            populateLineDropdown() {
                const select = document.getElementById('line-filter-select');
                if (!this.allLineCategories || this.allLineCategories.length === 0) return;

                const existingOptions = Array.from(select.options).map(o => o.value);
                const targetOptions = [...this.allLineCategories];

                if (JSON.stringify(targetOptions) !== JSON.stringify(existingOptions)) {
                    select.innerHTML = '';
                    this.allLineCategories.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        select.appendChild(opt);
                    });
                }

                if (!this.selectedLine || !this.allLineCategories.includes(this.selectedLine)) {
                    this.selectedLine = this.allLineCategories[0];
                }

                select.value = this.selectedLine;
            },

            onLineChange() {
                const select = document.getElementById('line-filter-select');
                this.selectedLine = select.value || (this.allLineCategories.length > 0 ? this.allLineCategories[0] : '');
                this.currentPage = 0;
                document.getElementById('current-line-title').innerText = this.selectedLine 
                    ? `LINE: ${this.selectedLine.toUpperCase()}`
                    : 'PRODUCTION DATA';
                this.fetchData();
            },

            onPageSizeChange() {
                const select = document.getElementById('page-size-select');
                this.pageSize = parseInt(select.value, 10) || 7;
                this.currentPage = 0;
                this.renderTableBody();
            },

            prevPage() {
                if (this.currentPage > 0) {
                    this.currentPage--;
                    this.renderTableBody();
                }
            },

            nextPage() {
                const totalPages = Math.ceil((this.matrixData ? this.matrixData.length : 0) / this.pageSize);
                if (this.currentPage + 1 < totalPages) {
                    this.currentPage++;
                    this.renderTableBody();
                }
            },

            startAutoCycle() {
                this.autoCycle = true;
                const btn = document.getElementById('auto-cycle-btn');
                const statusText = document.getElementById('cycle-status-text');

                if (btn) {
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fa-solid fa-rotate fa-spin"></i> Auto-Cycle: ON (15s)';
                }

                if (this.cycleInterval) clearInterval(this.cycleInterval);

                if (this.allLineCategories && this.allLineCategories.length > 0) {
                    this.cycleIndex = 0;
                    this.currentPage = 0;
                    this.runAutoCycleStep();
                    this.cycleInterval = setInterval(() => this.runAutoCycleStep(), 15000);
                } else if (statusText) {
                    statusText.innerText = 'Mode: Auto-cycle enabled (No line categories found)';
                }
            },

            stopAutoCycle() {
                this.autoCycle = false;
                const btn = document.getElementById('auto-cycle-btn');
                const statusText = document.getElementById('cycle-status-text');

                if (btn) {
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> Auto-Cycle: OFF';
                }
                if (statusText) statusText.innerText = 'Mode: Static View';
                if (this.cycleInterval) clearInterval(this.cycleInterval);
            },

            toggleAutoCycle() {
                if (this.autoCycle) {
                    this.stopAutoCycle();
                } else {
                    this.startAutoCycle();
                }
            },

            runAutoCycleStep() {
                if (!this.allLineCategories || this.allLineCategories.length === 0) return;

                // Page Flipping Check: If current line has more boards than pageSize, flip page first!
                if (this.selectedLine && this.matrixData && this.matrixData.length > this.pageSize && this.pageSize < 999) {
                    const totalPages = Math.ceil(this.matrixData.length / this.pageSize);
                    if (this.currentPage + 1 < totalPages) {
                        this.currentPage++;
                        this.renderTableBody();
                        const lineName = this.selectedLine.toUpperCase();
                        const catPos = (this.cycleIndex === 0 ? this.allLineCategories.length : this.cycleIndex);
                        document.getElementById('current-line-title').innerText = `LINE: ${lineName} (${catPos}/${this.allLineCategories.length})`;
                        document.getElementById('cycle-status-text').innerText = `Mode: Auto-cycling (${this.selectedLine} - Page ${this.currentPage + 1}/${totalPages})`;
                        return;
                    }
                }

                // Reset page for next line category
                this.currentPage = 0;

                if (this.cycleIndex >= this.allLineCategories.length) {
                    this.cycleIndex = 0;
                }

                this.selectedLine = this.allLineCategories[this.cycleIndex];
                
                document.getElementById('line-filter-select').value = this.selectedLine;
                document.getElementById('current-line-title').innerText = `LINE: ${this.selectedLine.toUpperCase()} (${this.cycleIndex + 1}/${this.allLineCategories.length})`;
                document.getElementById('cycle-status-text').innerText = `Mode: Auto-cycling (${this.cycleIndex + 1}/${this.allLineCategories.length}: ${this.selectedLine})`;
                
                this.fetchData();
                this.cycleIndex = (this.cycleIndex + 1) % this.allLineCategories.length;
            },

            getStageBadgeClass(stageName) {
                const s = stageName.toLowerCase();
                if (s.includes('empty') || s.includes('bare')) return 'qty-emptyboard';
                if (s.includes('smd')) return 'qty-smd';
                if (s.includes('pin')) return 'qty-pinsolder';
                if (s.includes('dip')) return 'qty-dipsolder';
                if (s.includes('clean')) return 'qty-cleaning';
                if (s.includes('test')) return 'qty-testing';
                if (s.includes('stock')) return 'qty-stock';
                if (s.includes('deliver')) return 'qty-delivery';
                return 'qty-emptyboard';
            },

            renderTableHeader() {
                const theadRow = document.getElementById('matrix-thead-row');
                let html = `
                    <th class="board-col">Product Board</th>
                `;

                this.stages.forEach(st => {
                    html += `<th>${st}</th>`;
                });

                theadRow.innerHTML = html;
            },

            renderTableBody() {
                const tbody = document.getElementById('matrix-tbody');
                const pageBadge = document.getElementById('page-indicator-badge');
                const pageNav = document.getElementById('page-nav-btns');
                tbody.innerHTML = '';

                if (!this.matrixData || this.matrixData.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="${this.stages.length + 1}" style="padding: 3rem; text-align: center; color: var(--text-muted); font-size: 1.3rem;">
                                No board products found for selected line category.
                            </td>
                        </tr>
                    `;
                    if (pageBadge) pageBadge.style.display = 'none';
                    if (pageNav) pageNav.style.display = 'none';
                    return;
                }

                // Calculate Pagination
                const totalBoards = this.matrixData.length;
                const totalPages = Math.ceil(totalBoards / this.pageSize);

                if (this.currentPage >= totalPages) {
                    this.currentPage = 0;
                }

                if (totalPages > 1 && this.pageSize < 999) {
                    if (pageBadge) {
                        pageBadge.style.display = 'inline-block';
                        pageBadge.innerText = `Page ${this.currentPage + 1}/${totalPages} (${totalBoards} Boards)`;
                    }
                    if (pageNav) pageNav.style.display = 'flex';
                } else {
                    if (pageBadge) pageBadge.style.display = 'none';
                    if (pageNav) pageNav.style.display = 'none';
                }

                const startIndex = this.currentPage * this.pageSize;
                const endIndex = Math.min(startIndex + this.pageSize, totalBoards);
                const visibleRows = (this.pageSize >= 999) ? this.matrixData : this.matrixData.slice(startIndex, endIndex);

                // Render visible rows for this page
                visibleRows.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    let cellsHtml = `
                        <td class="board-cell">${this.escapeHtml(row.board_name)}</td>
                    `;

                    this.stages.forEach(st => {
                        const qty = row.stage_quantities ? (row.stage_quantities[st] || 0) : 0;

                        if (qty > 0) {
                            const badgeClass = this.getStageBadgeClass(st);
                            cellsHtml += `<td><span class="qty-badge ${badgeClass}">${qty}</span></td>`;
                        } else {
                            cellsHtml += `<td><span class="qty-empty">-</span></td>`;
                        }
                    });

                    tr.innerHTML = cellsHtml;
                    tbody.appendChild(tr);
                });
            },

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        alert(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            },

            escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }
        };

        window.addEventListener('DOMContentLoaded', () => displayApp.init());
    </script>
</body>
</html>
